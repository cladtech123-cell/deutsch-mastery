server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # When a trusted proxy sits in front (the host's nginx for a domain, or the cloudflared container), take the
    # real client IP from its X-Forwarded-For so per-IP rate limits stay per user. Only private/loopback peers are
    # trusted; on a server FRONTEND_BIND=127.0.0.1 keeps everyone else from reaching this nginx directly.
    # real_ip_recursive picks the rightmost untrusted address, so a forged left-hand entry is ignored.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # $http_host keeps the port ($host drops it), so the backend's same-origin check works on any port
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        # overwrite, never append: the backend trusts the leftmost entry, which a client could forge to dodge rate limits
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 90s;
        client_max_body_size 1m;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes resolve to index.html.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
