<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lesebuch A2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: one 680px reading column; the library is a shelf of yellow school booklets (Reclam-style). */
:root {
  --bg: #F5F5F1; --surface: #FFFFFF; --ink: #18181B; --muted: #5E5E66; --line: #DFDED6;
  --book: #F4C20D; --book-ink: #1A1600; --mark: #FBE7A0; --link: #1F4FA3;
  --good: #1E7F45; --good-bg: #E3F3E9; --bad: #B3322A; --bad-bg: #FBE6E4;
  --f-read: "Literata", Georgia, "Times New Roman", serif;
  --f-ui: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #131315; --surface: #1D1D21; --ink: #ECECE8; --muted: #A2A2AA; --line: #2F2F35;
  --book: #E2B30B; --book-ink: #1A1600; --mark: #4B3F0F; --link: #93B4F2;
  --good: #63C98E; --good-bg: #183424; --bad: #F08176; --bad-bg: #3A1D1A; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #131315; --surface: #1D1D21; --ink: #ECECE8; --muted: #A2A2AA; --line: #2F2F35;
  --book: #E2B30B; --book-ink: #1A1600; --mark: #4B3F0F; --link: #93B4F2;
  --good: #63C98E; --good-bg: #183424; --bad: #F08176; --bad-bg: #3A1D1A; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--f-ui); margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
.wrap { max-width: 680px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px 8px; }
.brand { background: none; border: 0; padding: 0; font-weight: 800; font-size: 1.25rem; letter-spacing: -0.01em; }
.brand span { background: var(--book); color: var(--book-ink); padding: 0 6px; margin-left: 2px; }
.stats { display: flex; align-items: center; gap: 10px; font-size: 0.875rem; font-variant-numeric: tabular-nums; color: var(--muted); }
.stats b { color: var(--ink); }
.goal { width: 72px; height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
.goal-fill { height: 100%; width: 0; background: var(--book); transition: width .3s; }
.tabs { display: flex; gap: 4px; padding-block: 0; }
.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; padding: 8px 12px; font-weight: 600; color: var(--muted); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--book); }

main { padding-block: 24px 240px; }
.h { font-size: 1.75rem; line-height: 1.2; margin: 0 0 4px; font-weight: 800; letter-spacing: -0.015em; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 20px; }
.meta { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 0 0 6px; font-weight: 600; }

.shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
.book { text-align: left; background: var(--book); color: var(--book-ink); border: 0; border-radius: 2px 6px 6px 2px; padding: 16px 16px 14px;
  min-height: 170px; display: flex; flex-direction: column; gap: 4px; box-shadow: inset 6px 0 0 rgba(0,0,0,.12); transition: transform .15s; }
.book:hover { transform: translateY(-3px); }
.book .no { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; opacity: .7; }
.book .bt { font-family: var(--f-read); font-weight: 600; font-size: 1.3rem; line-height: 1.2; }
.book .bu { font-size: 0.875rem; opacity: .8; }
.book .meta { color: inherit; opacity: .75; margin: auto 0 0; padding-top: 12px; }
.book.read .bt::after { content: " ✓"; }

.back { background: none; border: 0; padding: 0; color: var(--link); font-weight: 600; margin-bottom: 16px; }
.reader .body { font-family: var(--f-read); font-size: 1.25rem; line-height: 1.85; max-width: 65ch; }
.reader .body p { margin: 0 0 1em; }
.w { background: none; border: 0; margin: 0; padding: 0 1px; border-radius: 3px; font: inherit; color: inherit; border-bottom: 1px dotted transparent; }
.w:hover { border-bottom-color: var(--muted); }
.w.saved { background: var(--mark); }
.w.cur { outline: 2px solid var(--book); }
.hint { font-size: 0.875rem; color: var(--muted); margin: 0 0 16px; }

.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; background: var(--ink); color: var(--bg); border: 1px solid var(--ink);
  border-radius: 8px; padding: 10px 16px; font-weight: 600; text-decoration: none; font-size: 0.95rem; }
.btn.ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn.big { padding: 14px 22px; font-size: 1.05rem; }
.btn.good { background: var(--good); border-color: var(--good); color: var(--surface); }
.btn.bad { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.icon { background: none; border: 1px solid var(--line); border-radius: 8px; width: 40px; height: 40px; flex: none; }

.quiz { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 20px; }
.quiz h2 { font-size: 1.25rem; margin: 0 0 12px; }
.q { margin-bottom: 18px; }
.q p { margin: 0 0 8px; font-weight: 600; }
.opts { display: grid; gap: 6px; }
.opt { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; }
.opt:not(:disabled):hover { border-color: var(--muted); }
.opt:disabled { cursor: default; }
.opt.right { background: var(--good-bg); border-color: var(--good); color: var(--good); font-weight: 600; }
.opt.wrong { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.res { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; display: grid; gap: 12px; }
.res b { font-size: 1.15rem; }

.vlist { list-style: none; margin: 20px 0 0; padding: 0; }
.vlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 4px 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.vw { font-family: var(--f-read); font-weight: 600; font-size: 1.1rem; }
.vt { grid-column: 1; color: var(--muted); font-size: 0.9rem; min-width: 0; }
.lvl { grid-row: 1 / span 2; grid-column: 2; letter-spacing: 2px; color: var(--book); font-size: 0.8rem; }
.vlist .icon { grid-row: 1 / span 2; grid-column: 3; }
.empty { text-align: center; padding: 40px 0; display: grid; gap: 8px; justify-items: center; }
.empty p { margin: 0; color: var(--muted); max-width: 40ch; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 32px 20px; display: grid; gap: 18px; justify-items: center; text-align: center; }
.cw { font-family: var(--f-read); font-size: 2.25rem; font-weight: 600; }
.ct { font-size: 1.15rem; }

.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--surface); border-top: 1px solid var(--line);
  box-shadow: 0 -8px 24px rgba(0,0,0,.12); padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px)); }
.sheet-in { padding-top: 16px; display: grid; gap: 10px; }
.srow { display: flex; align-items: center; gap: 8px; }
.sw { font-family: var(--f-read); font-size: 1.6rem; flex: 1; min-width: 0; overflow-wrap: anywhere; }
.str { margin: 0; font-size: 1.05rem; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap bar">
    <button class="brand" data-go="lib">Lesebuch<span>A2</span></button>
    <div class="stats">
      <span title="Ketma-ket faol kunlar">🔥 <b id="streak">0</b></span>
      <div class="goal" title="Kunlik maqsad: 20 XP"><div class="goal-fill" id="goalFill"></div></div>
      <span><b id="goalTxt">0</b>/20 XP</span>
    </div>
  </div>
  <nav class="wrap tabs">
    <button data-go="lib" id="tabLib">Matnlar</button>
    <button data-go="vocab" id="tabVocab">Lug'atim</button>
  </nav>
</header>

<main class="wrap" id="app"></main>

<div class="sheet" id="sheet" role="dialog" aria-labelledby="sw" hidden>
  <div class="wrap sheet-in">
    <div class="srow">
      <b class="sw" id="sw"></b>
      <button class="icon" id="sspk" aria-label="Tinglash">🔊</button>
      <button class="icon" id="sx" aria-label="Yopish">✕</button>
    </div>
    <p class="str" id="str"></p>
    <div class="row">
      <button class="btn" id="sadd"></button>
      <a class="btn ghost" id="sgt" target="_blank" rel="noopener">Google Translate ↗</a>
    </div>
  </div>
</div>

<script src="logic.js"></script>
<script src="texts.js"></script>
<script>
const KEY = 'a2lesen', GOAL = 20;
const $ = s => document.querySelector(s);
const app = $('#app'), sheet = $('#sheet');
const tts = 'speechSynthesis' in window;
const blank = () => ({ xp: 0, xpDay: '', xpToday: 0, streak: 0, last: null, done: {}, cards: {} });

// shortcut: progress lives only in this browser (localStorage); add accounts/sync if learners need several devices
function load() {
  try {
    const s = { ...blank(), ...JSON.parse(localStorage.getItem(KEY)) };
    return s.cards && typeof s.cards === 'object' && s.done && typeof s.done === 'object' ? s : blank();
  } catch { return blank(); }
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch {} }
let S = load(), view = { name: 'lib' }, quiz = null, rv = null, word = null;

function addXp(n) {
  const day = todayISO();
  if (S.xpDay !== day) { S.xpDay = day; S.xpToday = 0; }
  S.xp += n; S.xpToday += n;
  S = touchStreak(S, day);
  save(); renderStats();
}

function renderStats() {
  const day = todayISO(), xp = S.xpDay === day ? S.xpToday : 0;
  $('#streak').textContent = currentStreak(S, day);
  $('#goalTxt').textContent = xp;
  $('#goalFill').style.width = Math.min(100, xp / GOAL * 100) + '%';
}

function speak(text) {
  if (!tts) return;
  speechSynthesis.cancel();
  const voice = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').startsWith('de'));
  let u;
  for (const s of text.match(/[^.!?“]+[.!?“]*\s*/g) || [text]) { // one utterance per sentence: long ones get cut off in Chrome
    u = new SpeechSynthesisUtterance(s);
    u.lang = 'de-DE'; u.rate = 0.85;
    if (voice) u.voice = voice;
    speechSynthesis.speak(u);
  }
  return u;
}

function go(name, arg) {
  view = { name, arg };
  if (tts) speechSynthesis.cancel();
  closeWord();
  if (name === 'review') rv = { q: Object.values(S.cards).filter(c => isDue(c, todayISO())).map(c => c.w.toLowerCase()), ok: 0, shown: false };
  render();
  scrollTo(0, 0);
}

function render() {
  $('#tabLib').classList.toggle('on', view.name === 'lib' || view.name === 'read');
  $('#tabVocab').classList.toggle('on', view.name === 'vocab' || view.name === 'review');
  $('#tabVocab').textContent = `Lug'atim (${Object.keys(S.cards).length})`;
  ({ lib: renderLib, read: renderRead, vocab: renderVocab, review: renderReview })[view.name](view.arg);
  renderStats();
}

function renderLib() {
  app.innerHTML = `<h1 class="h">Matnlar</h1>
    <p class="sub">A2 darajadagi qisqa hikoyalar. O'qing, notanish so'zni bosing, oxirida savollarga javob bering.</p>
    <div class="shelf">${TEXTS.map((t, i) => {
      const d = S.done[t.id];
      return `<button class="book${d != null ? ' read' : ''}" data-open="${t.id}">
        <span class="no">Nr. ${i + 1}</span><span class="bt">${t.title}</span><span class="bu">${t.uz}</span>
        <span class="meta">${t.topic} · ${d != null ? `${d}/${t.quiz.length} to'g'ri` : `${t.quiz.length} savol`}</span></button>`;
    }).join('')}</div>`;
}

function renderRead(id) {
  const t = TEXTS.find(x => x.id === id);
  quiz = { t, answers: [] };
  const para = p => tokenize(p).map((x, k) => k % 2 ? `<button class="w${S.cards[x.toLowerCase()] ? ' saved' : ''}" data-w="${x}">${x}</button>` : x).join('');
  app.innerHTML = `<button class="back" data-go="lib">← Matnlar</button>
    <article class="reader">
      <p class="meta">A2 · ${t.topic}</p><h1 class="h">${t.title}</h1><p class="sub">${t.uz}</p>
      <div class="row" style="margin-bottom:12px">${tts ? `<button class="btn ghost" id="listen">🔊 Tinglash</button>` : ''}</div>
      <p class="hint">So'zni bosing — tarjimasi chiqadi. Sariq so'zlar lug'atingizda bor.</p>
      <div class="body">${t.body.split('\n').map(p => `<p>${para(p)}</p>`).join('')}</div>
    </article>
    <section class="quiz">
      <h2>Tushundingizmi?</h2>
      ${t.quiz.map((q, qi) => `<div class="q" id="q${qi}"><p>${qi + 1}. ${q.q}</p><div class="opts">${q.o.map((o, oi) =>
        `<button class="opt" data-q="${qi}" data-o="${oi}">${o}</button>`).join('')}</div></div>`).join('')}
      <div id="result"></div>
    </section>`;
}

function answer(qi, oi) {
  const t = quiz.t;
  if (quiz.answers[qi] != null) return;
  quiz.answers[qi] = oi;
  $('#q' + qi).querySelectorAll('.opt').forEach((b, k) => {
    b.disabled = true;
    if (k === t.quiz[qi].a) b.classList.add('right'); else if (k === oi) b.classList.add('wrong');
  });
  if (quiz.answers.filter(x => x != null).length < t.quiz.length) return;
  const n = t.quiz.filter((q, k) => q.a === quiz.answers[k]).length;
  const gain = Math.max(0, n - (S.done[t.id] ?? 0)) * 5; // XP only for beating your best, so re-doing a quiz can't farm the goal
  S.done[t.id] = Math.max(S.done[t.id] ?? 0, n);
  if (gain) addXp(gain); else save();
  const next = TEXTS[TEXTS.indexOf(t) + 1];
  $('#result').innerHTML = `<div class="res"><span><b>${n}/${t.quiz.length} to'g'ri</b> · +${gain} XP</span>
    <div class="row">${next ? `<button class="btn" data-open="${next.id}">Keyingi matn →</button>` : ''}
    <button class="btn ghost" data-go="vocab">Lug'atimga o'tish</button></div></div>`;
}

function openWord(w, el) {
  const key = w.toLowerCase(), tr = DICT[key];
  document.querySelector('.w.cur')?.classList.remove('cur');
  el?.classList.add('cur');
  word = { w, key, tr };
  $('#sw').textContent = w;
  $('#str').textContent = tr || "Bu so'z lug'atda yo'q.";
  $('#sgt').href = 'https://translate.google.com/?sl=de&tl=uz&text=' + encodeURIComponent(w);
  $('#sspk').hidden = !tts;
  $('#sadd').hidden = !tr;
  $('#sgt').hidden = !!tr;
  updateAdd();
  sheet.hidden = false;
}

function closeWord() {
  sheet.hidden = true;
  document.querySelector('.w.cur')?.classList.remove('cur');
}

function updateAdd() { $('#sadd').textContent = S.cards[word.key] ? "✓ Lug'atda · olib tashlash" : "+ Lug'atga qo'shish"; }

function toggleWord() {
  if (S.cards[word.key]) delete S.cards[word.key];
  else S.cards[word.key] = { w: word.w, tr: word.tr, box: 0, due: todayISO() };
  save(); updateAdd();
  document.querySelectorAll('.w').forEach(b => b.classList.toggle('saved', !!S.cards[b.dataset.w.toLowerCase()]));
  $('#tabVocab').textContent = `Lug'atim (${Object.keys(S.cards).length})`;
}

function listen() {
  const b = $('#listen');
  if (speechSynthesis.speaking) { speechSynthesis.cancel(); b.textContent = '🔊 Tinglash'; return; }
  const last = speak(quiz.t.body.replace(/\n/g, ' '));
  b.textContent = "⏹ To'xtatish";
  last.onend = last.onerror = () => { b.textContent = '🔊 Tinglash'; }; // cancel() fires error, not end, in Chrome
}

const fmt = iso => iso.split('-').reverse().join('.');

function renderVocab() {
  const day = todayISO();
  const cards = Object.values(S.cards).sort((a, b) => a.due.localeCompare(b.due) || a.w.localeCompare(b.w));
  const due = cards.filter(c => isDue(c, day)).length;
  if (!cards.length) {
    app.innerHTML = `<div class="empty"><h1 class="h">Lug'atim</h1><p>Hali so'z yo'q.</p>
      <p>Matnni o'qing, notanish so'zni bosing va <b>«+ Lug'atga qo'shish»</b> tugmasini tanlang.</p>
      <button class="btn" data-go="lib">Matnlarga o'tish</button></div>`;
    return;
  }
  app.innerHTML = `<h1 class="h">Lug'atim</h1>
    <p class="sub">${cards.length} ta so'z. Har bir so'z to'g'ri javobdan keyin kamroq takrorlanadi: 1, 3, 7, 14, 30 kun.</p>
    ${due ? `<button class="btn big" data-go="review">Takrorlash · ${due} ta so'z</button>`
          : `<p>Bugun takrorlash kerak emas. Keyingisi: <b>${fmt(cards[0].due)}</b></p>`}
    <ul class="vlist">${cards.map(c => `<li>
      <span class="vw">${c.w}</span><span class="vt">${c.tr}</span>
      <span class="lvl" title="Daraja ${c.box} / 5" aria-label="Daraja ${c.box} / 5">${'●'.repeat(c.box)}${'○'.repeat(5 - c.box)}</span>
      <button class="icon" data-del="${c.w.toLowerCase()}" aria-label="${c.w} so'zini o'chirish">✕</button></li>`).join('')}</ul>`;
}

function renderReview() {
  if (!rv.q.length) {
    app.innerHTML = `<div class="empty"><h1 class="h">Barakalla!</h1>
      <p>Takrorlash tugadi: ${rv.ok} ta to'g'ri javob, +${rv.ok * 2} XP.</p>
      <button class="btn" data-go="vocab">Lug'atimga qaytish</button></div>`;
    return;
  }
  const c = S.cards[rv.q[0]];
  app.innerHTML = `<button class="back" data-go="vocab">← Lug'atim</button>
    <p class="meta">Qoldi: ${rv.q.length}</p>
    <div class="card">
      <div class="cw">${c.w}</div>
      ${tts ? `<button class="icon" data-say="${c.w}" aria-label="Tinglash">🔊</button>` : ''}
      ${rv.shown
        ? `<div class="ct">${c.tr}</div><div class="row"><button class="btn bad" data-rate="0">Bilmadim</button><button class="btn good" data-rate="1">Bildim</button></div>`
        : `<button class="btn big" data-show>Javobni ko'rsatish</button>`}
    </div>`;
}

function rate(ok) {
  const key = rv.q.shift();
  S.cards[key] = review(S.cards[key], ok, todayISO());
  if (ok) { rv.ok++; addXp(2); } else rv.q.push(key); // wrong words come back at the end of this session
  rv.shown = false;
  save(); renderReview();
}

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const d = b.dataset;
  if (d.go) go(d.go);
  else if (d.open) go('read', d.open);
  else if (d.w) openWord(d.w, b);
  else if (d.q) answer(+d.q, +d.o);
  else if (d.del) { delete S.cards[d.del]; save(); render(); }
  else if (d.say) speak(d.say);
  else if ('show' in d) { rv.shown = true; renderReview(); }
  else if (d.rate) rate(d.rate === '1');
  else if (b.id === 'listen') listen();
  else if (b.id === 'sspk') speak(word.w);
  else if (b.id === 'sx') closeWord();
  else if (b.id === 'sadd') toggleWord();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeWord(); });

render();
</script>
